name: CI/CD Pipeline - Loja Veloz

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  #  JOB 1: Testes e Validações dos Serviços
  build-and-test:
    name: Build & Validate Services
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Instalar Dependências do Gateway
      run: |
        cd api-gateway
        npm install

    - name: Instalar Dependências do Pedidos
      run: |
        cd services/pedidos
        npm install

    - name: Validar Build das Imagens Docker
      run: |
        docker build -t veloz-gateway:test ./api-gateway
        docker build -t veloz-pedidos:test ./services/pedidos
        docker build -t veloz-pagamentos:test ./services/pagamentos
        docker build -t veloz-estoque:test ./services/estoque

  #  JOB 2: Validação dos Manifestos Kubernetes
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar kubectl
      uses: azure/setup-kubectl@v4

    - name: Dry-run dos Manifestos Kubernetes
      run: |
        # Executa a validação em cada arquivo YAML da pasta k8s
        for file in k8s/*.yaml k8s/*.yml; do
          if [ -f "$file" ]; then
            echo "Validando $file..."
            kubectl apply --dry-run=client -f "$file"
          fi
        done