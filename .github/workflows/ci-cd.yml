name: CI/CD Pipeline - Loja Veloz

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  #  JOB 1: Testes e Validações
  build-and-test:
    name: Build & Validate Services
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-scale: '18'

    - name: Instalar Dependências do Gateway
      run: |
        cd api-gateway
        npm install

    - name: Instalar Dependências do Pedidos
      run: |
        cd services/pedidos
        npm install

    - name: Validar Build das Imagens Docker
      run: |
        docker build -t veloz-gateway:test ./api-gateway
        docker build -t veloz-pedidos:test ./services/pedidos
        docker build -t veloz-pagamentos:test ./services/pagamentos
        docker build -t veloz-estoque:test ./services/estoque

  #  JOB 2: Validação dos Manifestos K8s
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v3

    - name: Dry-run dos Manifestos Kubernetes
      run: |
        # Testa a sintaxe YAML de todos os manifestos na pasta k8s/
        kubectl apply --dry-run=client -f k8s/