name: CI/CD Pipeline - Loja Veloz

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 🧪 JOB 1: Build das Imagens e Teste das Aplicações
  build-and-test:
    name: Build & Validate Services
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Instalar Dependências do Gateway
      run: |
        cd api-gateway
        npm install

    - name: Instalar Dependências do Pedidos
      run: |
        cd services/pedidos
        npm install

    - name: Validar Build das Imagens Docker
      run: |
        docker build -t veloz-gateway:test ./api-gateway
        docker build -t veloz-pedidos:test ./services/pedidos
        docker build -t veloz-pagamentos:test ./services/pagamentos
        docker build -t veloz-estoque:test ./services/estoque

  # ☸️ JOB 2: Validação de Sintaxe dos Manifestos K8s
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Validar Sintaxe dos Arquivos YAML
      run: |
        # Valida a sintaxe YAML de todos os arquivos da pasta k8s usando Python
        python3 -c "
        import yaml, glob, sys
        has_error = False
        files = glob.glob('k8s/*.yaml') + glob.glob('k8s/*.yml')
        for f in files:
            try:
                with open(f) as file:
                    list(yaml.safe_load_all(file))
                print(f'✅ {f} - Sintaxe YAML válida!')
            except Exception as e:
                print(f'❌ Erro no arquivo {f}: {e}')
                has_error = True
        if has_error: sys.exit(1)
        "